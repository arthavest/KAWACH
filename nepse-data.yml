name: Refresh NEPSE data

on:
  schedule:
    # Every 30 minutes, 05:00-09:30 UTC (10:45-15:15 Nepal time), Sunday to Thursday
    - cron: "*/30 5-9 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nepse-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the NEPSE library
        run: pip install nepse-data-api

      - name: Fetch data
        run: python scripts/fetch_nepse.py

      - name: Commit the data file if it changed
        run: |
          git config user.name "kawach-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nepse_live.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh NEPSE data"
            git push
          fi
